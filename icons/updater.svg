<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="160" viewBox="-8 -8 176 176"
     version="1.1">
  <title>Refresh with warning</title>
  <desc>White refresh arrows and an orange warning symbol on a transparent canvas.</desc>

  <defs>
    <!-- Remove the whole warning-symbol area from the refresh underneath it. -->
    <mask id="warning-clearance" maskUnits="userSpaceOnUse"
          x="-8" y="-8" width="176" height="176" mask-type="luminance">
      <rect x="-8" y="-8" width="176" height="176" fill="#FFFFFF"/>
      <g transform="matrix(0.4179375 0 0 0.4179375 86.565 86.565)">
        <path fill="#000000" stroke="#000000" stroke-width="18"
              stroke-linecap="round" stroke-linejoin="round"
              d="M80 9.5
                 C75.4 9.5 71.2 12.1 68.8 16.4
                 L10.3 121.1
                 C3.1 134.1 12.5 150 27.3 150
                 H132.7
                 C147.5 150 156.9 134.1 149.7 121.1
                 L91.2 16.4
                 C88.8 12.1 84.6 9.5 80 9.5 Z"/>
      </g>
    </mask>
  </defs>

  <!-- Refresh symbol. The mask creates a transparent cutout beneath the warning. -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12"
     stroke-linejoin="round" stroke-linecap="round"
     mask="url(#warning-clearance)">
    <path d="M28 31
      C54 10 88 7 115 21
      C132 30 144 45 151 63
      L159 63
      L143 91
      L127 63
      L135 63
      C128 47 117 35 103 29
      C82 19 58 23 39 40
      Z"/>
    <path d="M132 128
      C106 150 72 154 44 139
      C27 130 15 114 10 97
      L2 97
      L18 69
      L34 97
      L26 97
      C32 113 43 125 57 132
      C79 143 105 138 121 121
      Z"/>
  </g>

  <!-- Warning symbol, as native paths in the same SVG. -->
  <g transform="matrix(0.4179375 0 0 0.4179375 86.565 86.565)"
     fill="none" stroke="#FF8A00" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 9.5
      C75.4 9.5 71.2 12.1 68.8 16.4
      L10.3 121.1
      C3.1 134.1 12.5 150 27.3 150
      H132.7
      C147.5 150 156.9 134.1 149.7 121.1
      L91.2 16.4
      C88.8 12.1 84.6 9.5 80 9.5 Z"/>
    <path d="M80 57 V91"/>
    <circle cx="80" cy="116" r="6.7" fill="#FF8A00" stroke="none"/>
  </g>
</svg>
