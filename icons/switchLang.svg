<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="#7B7E8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Верхний левый блок (одинарная рамка) -->
    <path d="M 2 6.5 V 3.5 A 1.5 1.5 0 0 1 3.5 2 H 12.5 A 1.5 1.5 0 0 1 14 3.5 V 12.5 A 1.5 1.5 0 0 1 12.5 14 H 3.5 A 1.5 1.5 0 0 1 2 12.5 V 9.5" />

    <!-- Нижний правый блок (одинарная рамка) -->
    <path d="M 14 10 H 20.5 A 1.5 1.5 0 0 1 22 11.5 V 14.5" />
    <path d="M 22 17.5 V 20.5 A 1.5 1.5 0 0 1 20.5 22 H 11.5 A 1.5 1.5 0 0 1 10 20.5 V 14" />

    <!-- Верхняя правая стрелка -->
    <path d="M 20.5 7.5 A 4.5 4.5 0 0 0 16.5 3.5" />
    <path d="M 18.5 3.2 L 16.2 3.5 L 16.5 5.8" />

    <!-- Нижняя левая стрелка -->
    <path d="M 3.5 16.5 A 4.5 4.5 0 0 0 7.5 20.5" />
    <path d="M 5.5 20.8 L 7.8 20.5 L 7.5 18.2" />

  </g>

  <!-- Символы А и 文 в векторе (для четкого отображения в любом размере) -->
  <g fill="none" stroke="#7B7E8B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Буква А (в верхнем левом блоке) -->
    <path d="M 5 11 L 8 4.5 L 11 11 M 6 9.5 H 10" />

    <!-- Китайский символ 文 (в нижнем правом блоке) -->
    <path d="M 16 14.5 H 19" />
    <path d="M 17.5 13 V 15.5" />
    <path d="M 17.5 15.5 C 16.5 17.5 15 18.5 13.5 19" />
    <path d="M 16.5 16.5 L 19 19.5" />
  </g>
</svg>